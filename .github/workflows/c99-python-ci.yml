name: C99 Kernel & Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Build C99 Test Harness & Shared Library (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x src/compile_native.sh
          ./src/compile_native.sh
          gcc -O3 -std=c99 -Wall tests/test_runner_reservoir.c src/root_free_reservoir_core.c -Isrc -lm -o tests/test_runner
          ./tests/test_runner

      - name: Build C99 Test Harness (Windows)
        if: runner.os == 'Windows'
        run: |
          gcc -O3 -std=c99 -Wall -shared -DRESERVOIR_EXPORTS src/root_free_reservoir_core.c -Isrc -o src/root_free_reservoir_core.dll
          gcc -O3 -std=c99 -Wall tests/test_runner_reservoir.c src/root_free_reservoir_core.c -Isrc -o tests/test_runner.exe
          .\tests\test_runner.exe

      - name: Run Python SPE Benchmark Certification Suite
        run: |
          python python/spe_pta_benchmark_suite.py
